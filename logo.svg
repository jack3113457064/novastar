<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#1E1050"/>
      <stop offset="100%" style="stop-color:#08041A"/>
    </radialGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="50%" style="stop-color:#FF8C00"/>
      <stop offset="100%" style="stop-color:#FF4500"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 背景圆 -->
  <circle cx="128" cy="128" r="125" fill="url(#bg)" stroke="#2A1558" stroke-width="3"/>

  <!-- 星轨 -->
  <ellipse cx="128" cy="128" rx="100" ry="30" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" transform="rotate(-30 128 128)"/>

  <!-- 主星 -->
  <polygon points="128,35 150,95 215,98 163,137 178,198 128,162 78,198 93,137 41,98 106,95"
           fill="url(#starGrad)" filter="url(#glow)"/>

  <!-- 小星 -->
  <circle cx="60" cy="60" r="4" fill="white" opacity="0.6"/>
  <circle cx="200" cy="70" r="3" fill="white" opacity="0.4"/>
  <circle cx="50" cy="180" r="3" fill="white" opacity="0.5"/>
  <circle cx="210" cy="190" r="4" fill="white" opacity="0.4"/>
  <circle cx="100" cy="210" r="2" fill="white" opacity="0.3"/>
  <circle cx="170" cy="45" r="2" fill="white" opacity="0.5"/>

  <!-- 代币符号 -->
  <text x="128" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" opacity="0.9">NOVA</text>
</svg>
